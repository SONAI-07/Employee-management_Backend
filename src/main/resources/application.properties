spring.application.name=Employeger

# ===============================
# = DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/employeger_db
spring.datasource.username=postgres
spring.datasource.password=Abcd
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# REDIS CONFIGURATION (FIXED SYNTAX)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379


# ===============================
# OAUTH 2.0 INTEGRATIONS
# ===============================
# GitHub OAuth
github.client-id=YOUR_GITHUB_CLIENT_ID
github.client-secret=YOUR_GITHUB_CLIENT_SECRET
github.redirect-uri=http://localhost:8080/api/integration/github/callback

# Microsoft OAuth (Azure AD)
microsoft.client-id=YOUR_MICROSOFT_CLIENT_ID
microsoft.client-secret=YOUR_MICROSOFT_CLIENT_SECRET
microsoft.redirect-uri=http://localhost:8080/api/integration/microsoft/callback